# cargo-mutants (https://mutants.rs): mutation testing of the security kernels, `just mutants`
# (tower-net, tower-kv, tower-protocol). How it is run, what it found and the results are in
# docs/test-strategy.md (layer 6).
#
# This file is read by every `cargo mutants` run from the repo root; nothing else reads it (cargo
# itself ignores it).

# Every cargo call in this repository is `--locked` (AGENTS.md): the mutants are built and tested
# against the committed Cargo.lock, in the copy of the tree cargo-mutants works in.
additional_cargo_args = ["--locked"]

# Mutants that no test can tell from the original: the change does not alter what the code does.
# Each is listed with the reason, so `just mutants` reports only survivors nobody has looked at.
# A regex matches the mutant's name as `cargo mutants --list` prints it,
# `<file>:<line>:<column>: <change> in <function>`. Where a function holds the same change more
# than once, the pattern names the column (and any line): a column survives edits elsewhere in
# the file, a line number does not. A pattern that stops matching just brings its mutant back as a
# survivor to look at again.
exclude_re = [
    # `1 << 0` and `1 >> 0` are both 1: bit 0 of a flags byte (`ack_flags::PENDING`,
    # `NODE_FLAG_SLEEPING`). The other bits are pinned by value (`NODE_FLAG_UNNAMED` in
    # crates/protocol/tests/constants.rs).
    'crates/net/src/ack\.rs:\d+:\d+: replace << with >>$',
    'crates/protocol/src/mgmt\.rs:\d+:38: replace << with >>$',

    # tower-kv, `blank_step_span`: `(n - w).min(4)` is the length of the word at `w` in a chunk
    # of `n` bytes. Every span the codec blanks is whole words (a half, a superblock; const
    # asserts at the top of the file), so `n` and `w` are multiples of 4 with `w < n`, and
    # `n - w` and `n + w` are both at least 4: the `min` is 4 either way.
    'crates/kv/src/lib\.rs:\d+:25: replace - with \+ in blank_step_span$',

    # tower-kv, `flip`: `while o < src_free` copies the latest records below the source log's end.
    # With `<=` the loop also reads the header AT the log end (a blank word, a torn record, or
    # the first bytes past a full half, all inside the region): no plan entry names that offset
    # (pass 1 recorded offsets below `src_free` only), so nothing is copied and the loop ends.
    'crates/kv/src/lib\.rs:\d+:13: replace < with <= in flip$',

    # tower-kv, `flip_step`, phase A: `if st.blank_off < half { blank some more }`. With `<=` a
    # finished blank (`blank_off == half`) calls `blank_step_span` once more from the end of the
    # span, which reads nothing, writes nothing and returns `half` again.
    'crates/kv/src/lib\.rs:\d+:21: replace < with <= in flip_step$',

    # tower-kv, `flip_step`, phase B: `while st.read_off < st.src_end`, the same as `flip` above:
    # with `<=` the header at the planned log end is read, is in no plan entry, and is skipped.
    # `read_off` then sits past `src_end`, which only this loop reads.
    'crates/kv/src/lib\.rs:\d+:23: replace < with <= in flip_step$',

    # tower-shell (`just mutants shell`), `Window::feed`. `room = cap - captured` only clamps
    # the slice's end as a second guard: the window `[skip, skip + cap)` already ends it there
    # (what was captured lies inside the window, before this piece), so a larger `room` changes
    # nothing. And `while hi > lo && !is_char_boundary(hi)`: `lo` is a char boundary by then, so
    # the loop stops at `hi == lo` with `>=` too.
    'crates/shell/src/lib\.rs:\d+:29: replace - with \+ in Window::feed$',
    'crates/shell/src/lib\.rs:\d+:18: replace > with >= in Window::feed$',

    # tower-taf (`just mutants taf`). `Day::set_point`: a point at the new point's minute was
    # skipped two lines above (it is being replaced), so `p.minute > minute` and `>=` agree.
    'crates/taf/src/program\.rs:\d+:36: replace > with >= in Day::set_point$',
    # `minutes_until`: a weekday of `w + 7` is `w` again once the sum is taken modulo the week
    # (`(w + 7) * 1440` and `(w % 7) * 1440` differ by whole weeks).
    'crates/taf/src/program\.rs:\d+:35: replace % with \+ in minutes_until$',

    # tower-radio (`just mutants radio`). `frame_toa_ms`: `if ms > u32::MAX { u32::MAX } else
    # { ms }` gives `u32::MAX` for `ms == u32::MAX` either way.
    'crates/radio/src/lib\.rs:\d+:11: replace > with >= in frame_toa_ms$',
    # CCM's B0 flags byte is three fields that share no bit (`0x40`, `M' << 3`, `L'`): `|` and
    # `^` are the same. The AAD buffer is `2 + MAX_AAD` bytes; `2 * MAX_AAD` is only longer.
    # `block_xor` is called once, on the all-zero MAC state, where `^=` and `|=` agree.
    'crates/radio/src/ccm\.rs:\d+:\d+: replace \| with \^ in Ccm<A>::cbc_mac$',
    'crates/radio/src/ccm\.rs:\d+:33: replace \+ with \* in Ccm<A>::cbc_mac$',
    'crates/radio/src/ccm\.rs:\d+:16: replace \^= with \|= in block_xor$',

    # tower-modules (`just mutants modules`): `|` and `^` of masks that share no bit are the
    # same value. The LP8's status masks (`FATAL | ALGORITHM | MEMORY | SELF_DIAG`,
    # `VCAP1_LOW | VCAP2_LOW`, ...: single bits each), the MPL3115A2's oversampling field next
    # to its one-shot bit and the three bytes of its pressure shifted to their places, the
    # relay's bridge patterns (one pin each).
    'crates/modules/src/lp8\.rs:\d+:\d+: replace \| with \^ in Measurement::(needs_restart|vcap_low|ppm)$',
    'crates/modules/src/mpl3115a2\.rs:\d+:\d+: replace \| with \^ in (Oversampling::one_shot|pressure_deci_hpa)$',
    'crates/modules/src/relay\.rs:\d+:\d+: replace \| with \^( in drive)?$',
    # `1 << 0` and `1 >> 0` are both 1: the green LED's pin (the red one's, `1 << 1`, is pinned
    # by value).
    'crates/modules/src/relay\.rs:\d+:29: replace << with >>$',
]
