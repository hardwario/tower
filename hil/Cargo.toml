[package]
name = "tower-hil"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Hardware-in-the-loop (HIL) test harness for the HARDWARIO TOWER firmware SDK: drives a bench of a TOWER Core Module (J-Link SWD + Nordic PPK2) and a TOWER Radio Dongle (USB); flashes via probe-rs / `tower flash`, decodes the framed console NATIVELY (tower-protocol, so tests assert on typed Log/Event + seq-gaps, not `strings | grep`), and asserts smoke / radio / power behaviour. The hardware tests are `#[ignore]`d so `cargo test` still COMPILES them without a bench. See firmware/docs/test-plan.md."

# HOST crate in the monorepo's host workspace, so a plain `cargo test` builds for the native
# host, no --target juggling. It COMPILES the #[ignore]d hardware tests and runs none; the
# `just hil*` recipes opt INTO the bench run. The images under test are built from the sibling
# firmware/ workspace located by `firmware_dir()` (default ../firmware; override with
# TOWER_FIRMWARE_DIR). NEVER runs against hardware in CI.

[dependencies]
# Decode the framed console natively: the whole point of the harness over `strings | grep`. The
# same crates/protocol source tree the firmware and the `tower` CLI build (a path dependency), so
# the frames we assert on cannot be decoded against a different schema than the one flashed.
tower-protocol.workspace = true
# Deserialize the decoded postcard payloads (Log/Event/Hello/...), with std/alloc on the host (the
# harness owns copies of the borrowed message fields). Default features OFF (like tower-cli): the
# default `heapless-cas` drags in heapless 0.7 + the unmaintained atomic-polyfill
# (RUSTSEC-2023-0089) for nothing on a std host.
postcard = { workspace = true, features = ["use-std"] }
# Serial I/O to both boards' FTDI ports.
serialport.workspace = true
# tower-flasher (crates/flasher): its `port::Port` drives the tuned NRST/BOOT0 pulses (reset-into-app /
# reset-into-bootloader) we use to reset the Core.
tower-flasher.workspace = true
# Parse the hil.toml bench fixture (core/dongle serials, ppk2 supply). Tiny, std-only.
toml = "1"
serde = { workspace = true, features = ["std"] }

[dev-dependencies]
# The gateway group mints a fresh node key per run, like `tower nodes add --port` (a fixed key
# re-provisioned onto a board whose store was wiped would restart its counter under that key:
# CCM nonce reuse). The same crate and version the CLI mints with (no new lockfile entry).
getrandom = { version = "0.4", features = ["std"] }

[features]
default = []
# Gate the current-measurement tests. They need the PPK2 sidecar (ppk2d.py) + a PPK2-powered Core
# with NO VBUS on its USB; a data-only FTDI adapter may stay plugged (VBUS back-feeds VDD and
# inhibits STOP by design; the power test's plausibility floor catches it). Off by default so
# `just hil` (smoke/radio) never pulls the power path in.
power = []
