[package]
name = "tower-radio"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "no_std, hardware-free radio timing/CCM/compliance logic the HARDWARIO TOWER SDK builds on: the EU/US/FHSS duty token-bucket math (DutyGovernor refill/consume + residue carry), frame time-on-air, the fixed FHSS hop permutation and the AES-CCM core. Not the SPIRIT1 driver (that is the SDK's `tower::radio`); split out so the regulatory (FCC §15.247 / EU duty) arithmetic is unit-tested on the host."

# Leaf crate: NO dependency on embassy_time (the real-time `Instant` wrapper stays in
# firmware/src/radio/duty.rs and delegates here). That keeps this crate host-buildable AND host-testable
# with plain `cargo test`, exactly like crates/kv. The firmware re-exports these types from
# firmware/src/radio so no external API changes.
[dependencies]

[dev-dependencies]
# Pure-Rust AES-128, used ONLY by the host CCM tests as the `AesBlock` block cipher (the device
# uses the L0 hardware AES, the other `AesBlock` impl). A dev-dependency, so it never links into
# the firmware or adds flash. Verifies the CCM core against RFC 3610 Packet Vector #1.
aes = "0.9"
