[package]
name = "tower-protocol"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared wire protocol for the HARDWARIO TOWER link: COBS framing + CRC + postcard console, management and radio schemas. no_std; the firmware, the `tower` CLI and the HIL harness all build this one source tree by path, so no end can drift."
readme = "README.md"
keywords = ["hardwario", "tower", "embedded", "no-std", "protocol"]
categories = ["embedded", "no-std", "encoding"]

[dependencies]
# Schema is postcard (not self-describing): every end MUST share these exact
# struct definitions, which is the whole reason this crate exists.
serde.workspace = true
postcard.workspace = true
# COBS frame sync (0x00 delimiter). Used directly, not via postcard's accumulator,
# because our inner frame carries a trailing CRC after the postcard payload.
cobs = { version = "0.5", default-features = false }
# Bounded collections for the candidate/field lists; `serde` feature for (de)ser.
heapless.workspace = true
# Compile-time schema reflection for the schema tags (src/fingerprint.rs): every wire type
# derives `postcard_schema::Schema`, and a const-fn hasher folds the schema tree into the 16-bit
# `CONSOLE_TAG` / `RADIO_TAG` every frame and envelope carries. Pinned EXACTLY (`=`), together
# with the derive crate below: the host and firmware workspaces each resolve their own Cargo.lock
# and recompute the tags at build time, so a different postcard-schema / postcard-derive release
# (a changed builtin impl or derive expansion) could otherwise give the two ends different tags
# for the SAME source, a false mismatch. With both pinned, the tags are a pure function of this
# crate.
postcard-schema = { version = "=0.2.5", default-features = false, features = ["derive", "heapless-v0_9"] }
# Not used directly: listed only to pin the `Schema` derive's expansion (see above).
postcard-derive = { version = "=0.2.2" }
