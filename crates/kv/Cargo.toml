[package]
name = "tower-kv"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "no_std power-loss-safe key-value codec over byte-addressable EEPROM: the storage engine behind the HARDWARIO TOWER SDK's `tower::storage::Kv`. Hardware-free (generic over an `Eeprom` byte-store trait) so the record/scan/compaction logic is unit-tested on the host; the firmware itself is no_std and can't cargo test."

# The codec is generic over an `Eeprom` byte-store trait (the firmware implements it over the
# L0 data EEPROM; host tests implement it over a RAM array), and uses the shared CRC primitive
# so EEPROM records stay byte-compatible with the firmware.
[dependencies]
tower-protocol.workspace = true
