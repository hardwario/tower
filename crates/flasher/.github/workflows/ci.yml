name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow token is read-only everywhere.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # MUST equal `channel` in rust-toolchain.toml (the `audit` job enforces it), so CI builds with
  # exactly the toolchain a local checkout uses. Bump both together.
  RUST_TOOLCHAIN: "1.99.1"

# Every action is pinned to a full commit SHA (the comment names the release); Dependabot
# (.github/dependabot.yml) keeps the pins current. Every cargo invocation is `--locked`.
jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # serialport links against libudev on Linux.
      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust (rust-toolchain.toml pin)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  # tower-cli and tower-hil consume jolt with `default-features = false` (no clap/anyhow/
  # indicatif). Build+test that exact configuration so a CLI-only dependency leaking into the
  # library fails HERE, not in a downstream repo's CI.
  library:
    name: Library only (no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust (rust-toolchain.toml pin)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: no-default-features

      - name: Clippy (library config)
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings

      - name: Test (library config)
        run: cargo test --locked --no-default-features

  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install libudev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust (rust-toolchain.toml pin)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --locked --release

      # The lint job tests on Linux only; run the behavioural tests on every OS the
      # release ships for (timeout/port logic is the platform-sensitive part).
      - name: Test
        run: cargo test --locked

  # RustSec advisories. Vulnerabilities fail the job; informational warnings (unmaintained /
  # unsound / yanked) are printed but do not.
  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CI toolchain == rust-toolchain.toml
        run: |
          want="$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' rust-toolchain.toml)"
          if [ "$want" != "$RUST_TOOLCHAIN" ]; then
            echo "::error::rust-toolchain.toml pins '$want' but the workflows use RUST_TOOLCHAIN='$RUST_TOOLCHAIN'; bump both together"
            exit 1
          fi

      - name: Install cargo-audit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2

      # `cargo-audit audit`, not `cargo audit`: it only reads Cargo.lock, so no toolchain is
      # needed (the `cargo` proxy would otherwise resolve rust-toolchain.toml).
      - name: cargo audit
        run: cargo-audit audit
