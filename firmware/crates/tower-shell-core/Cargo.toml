[package]
name = "tower-shell-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/hardwario/tower-firmware"
description = "no_std pure kernels behind the HARDWARIO TOWER shell: the `addr` setting-value parser (`auto` / strict hex) and the non-cryptographic xorshift that mints `addr random`, the response-pagination window, and the TAB-completion helpers (char-safe common prefix, one-frame byte budget). Split out like tower-kv / tower-net-core so the logic can be unit-tested on the host; the firmware itself is no_std and can't cargo test."

# Pure functions only: no dependencies, no_std, host-testable with plain `cargo test`.
