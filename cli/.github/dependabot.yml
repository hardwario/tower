# Dependabot version updates (security updates are a repo setting; see SECURITY.md).
# Weekly, grouped, with a 7-day cooldown so a freshly published (possibly compromised) release
# is never picked up the day it appears. The GitHub Actions are pinned to full commit SHAs with a
# `# vX.Y.Z` comment; Dependabot bumps the SHA and the comment together.
version: 2
updates:
  # tower-protocol is NOT bot-bumped: it moves in lockstep across tower-firmware, tower-cli and
  # tower-hil in one coordinated change-set (control plane AGENTS.md runbook); postcard is not
  # self-describing, so a one-repo bump silently mis-decodes. jolt is bumped together in cli+hil.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: tower-protocol
      - dependency-name: jolt
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  # rust-toolchain.toml `channel`. The workflows pin the same version in RUST_TOOLCHAIN (env) and
  # a CI step fails while the two differ, so push the matching RUST_TOOLCHAIN bump onto the PR.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
