[package]
name = "tower-cli"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HARDWARIO TOWER host CLI (`tower`): decodes the framed serial console of the TOWER firmware, flashes over the UART bootloader, and bridges the radio network to MQTT."

[[bin]]
name = "tower"
path = "src/main.rs"

[features]
# The embedded MQTT broker (`tower gateway --broker`, the zero-config default). Default-on;
# opt out (`--no-default-features`) if rumqttd's dependency weight ever hurts a build target;
# external-broker mode (`--mqtt`) keeps working without it.
default = ["embedded-broker"]
embedded-broker = ["dep:rumqttd"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serialport.workspace = true
rustyline = "19"
ratatui = "0.30"
anyhow = "1"
# Flash/erase progress bars (tower-boot is UI-free and reports `Progress` events).
indicatif = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# `use-std`: the gateway engine builds owned frames/records with `to_stdvec` (this is
# a host binary; the no-alloc discipline is the firmware's constraint, not ours).
postcard = { workspace = true, features = ["use-std"] }
serde = { workspace = true, features = ["std"] }
# The gateway's MQTT side (`tower gateway` + the `nodes`/`net` client commands). rumqttc's
# synchronous Client/Connection API keeps the crate's no-async idiom: tokio appears only as
# an internal dependency of these two crates, never in our code. Default features OFF: both
# default to `use-rustls` (+ rumqttd `websocket`), and the rustls they build against (rustls
# 0.22/0.23, rustls-webpki 0.102, unmaintained rustls-pemfile) carries RustSec advisories
# that fail `cargo audit`. MQTT over TLS uses their `use-native-tls` backends instead: the
# platform's own TLS stack (Security.framework on macOS, SChannel on Windows, OpenSSL on
# Linux, see below). Never enable a rustls feature here.
rumqttc = { version = "0.25", default-features = false, features = ["use-native-tls"] }
rumqttd = { version = "0.20", optional = true, default-features = false, features = ["use-native-tls"] }
# Built directly for the client connector (extra root CAs, a client identity) and to validate
# the PKCS#12 identities at startup; the same crate rumqttc/rumqttd use underneath.
native-tls = "0.2"
serde_json = "1"
# RPC correlation ids for the MQTT request/response topics.
uuid = { version = "1", features = ["v4"] }
# CSPRNG for minting per-node AES keys (the device PRNGs are explicitly
# non-cryptographic, so the host is the only place keys may be generated).
getrandom = { version = "0.4", features = ["std"] }
# Single source of truth for the wire format, shared with the firmware and the HIL harness:
# all three build this one source tree by path (crates/protocol), so they cannot drift.
tower-protocol.workspace = true
# STM32 ROM UART-bootloader control (flash / erase / chip info / reset pulses), crates/boot.
tower-boot.workspace = true

[dev-dependencies]
# Tests build wire frames with the protocol's own message types; `ShellCompletions`/`Event`
# carry `heapless::Vec` fields, so the tests need heapless to construct them. `assert_cmd`
# drives the compiled `tower` binary end-to-end (help/usage/exit-code contract) with no
# hardware. The workspace's heapless, i.e. the one tower-protocol builds with.
heapless.workspace = true
assert_cmd = "2"
predicates = "3"
# The TLS tests mint a throwaway CA + server/client identities at test time (short validity, so
# nothing can expire in the tree, and within the 825-day limit macOS applies to every TLS
# server certificate): rcgen for the certificates (ring backend), p12-keystore to wrap them as
# the PKCS#12 files the CLI takes. Test-only: neither reaches the `tower` binary.
rcgen = "0.14"
p12-keystore = "0.4"

# native-tls is OpenSSL on Linux. `vendored` builds OpenSSL from source and links it
# statically, so a release binary keeps running on any glibc distribution regardless of its
# libssl version (needs perl + make + a C compiler at build time: the CI runners and the
# `cross` images have them, Cross.toml makes sure). The system's root CAs are still found at
# run time (native-tls probes the usual certificate locations). macOS and Windows use the OS
# stack and never build OpenSSL.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(unix)'.dependencies]
# Only used to restore the default SIGPIPE disposition at startup (see main()). Rust's
# runtime sets SIGPIPE to SIG_IGN, which turns a closed downstream pipe (`tower logs | head`)
# into an EPIPE that our print!/println! calls unwrap into a panic. Restoring SIG_DFL makes
# the process die quietly on the signal, matching every other Unix CLI.
libc = "0.2"
