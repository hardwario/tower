# Release the `tower` binary (cli/, package tower-cli) for every platform on a `cli-vX.Y.Z` tag,
# together with the product firmware built from the same commit (a `tower` binary and firmware
# from other sources refuse each other's frames, so the two ship as a matched set).
#
# The other crates are internal path dependencies with no releases or tags of their own.
#
# Dry run: start the workflow by hand on main (Actions > Release (tower CLI) > Run workflow). It
# runs the checks and every build and uploads the archives as workflow artifacts, but skips the
# tag gate and publishes nothing. Tags are immutable here, so a build that fails after tagging
# burns the version: dry-run a release first whenever the build or its dependencies changed.

name: Release (tower CLI)

on:
  push:
    tags:
      - 'cli-v[0-9]+.*'
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# Least privilege: everything is read-only except the final `publish` job, which alone gets
# the release-write + attestation (OIDC) permissions.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # MUST equal `channel` in rust-toolchain.toml (ci.yml's `audit` job enforces it).
  RUST_TOOLCHAIN: "1.99.1"

# Every action is pinned to a full commit SHA (the comment names the release); Dependabot keeps
# the pins current.
jobs:
  # Gate 1: only a tag that names a commit already on main, whose CI went green, may release:
  # pushing a tag must not be a way to ship an unreviewed or red commit.
  verify:
    name: Verify tag (version, on main, CI green)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read the CI workflow's runs for the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + origin/main for the ancestry check
          persist-credentials: false

      - name: Verify tag matches cli/Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#cli-v}"
          cargo_ver="$(grep -m1 '^version = ' cli/Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "tag=$tag  cargo=$cargo_ver"
          if [ "$tag" != "$cargo_ver" ]; then
            echo "::error::Tag cli-v$tag does not match cli/Cargo.toml version $cargo_ver"
            exit 1
          fi

      - name: Verify the tagged commit is on main
        run: |
          sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null \
            || { echo "::error::origin/main not fetched"; exit 1; }
          if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} -> $sha is not an ancestor of origin/main; release only commits that landed on main"
            exit 1
          fi
          echo "$sha is on main"

      # Waits (up to 60 min) for ci.yml on the tagged commit: the tag is usually pushed right
      # after main, so CI may still be running. Any successful CI run for this exact commit
      # passes; a run that finished red/cancelled with none pending fails; no run at all after
      # 10 min fails (CI runs per push HEAD; tag a commit that was the head of a push).
      - name: Verify CI succeeded for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
          while :; do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&per_page=100")"
            ok="$(jq '[.workflow_runs[] | select(.conclusion == "success")] | length' <<<"$runs")"
            pending="$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$runs")"
            total="$(jq '.workflow_runs | length' <<<"$runs")"
            if [ "$ok" -gt 0 ]; then echo "CI succeeded for $sha"; break; fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "::error::CI finished for $sha without success: fix main (or re-run CI), then re-run this release"
              exit 1
            fi
            if [ "$total" -eq 0 ] && [ "$SECONDS" -gt 600 ]; then
              echo "::error::no CI run exists for $sha; tag a commit CI ran on"
              exit 1
            fi
            if [ "$SECONDS" -gt 3600 ]; then echo "::error::timed out waiting for CI on $sha"; exit 1; fi
            echo "CI for $sha: $pending of $total run(s) still in progress, waiting"
            sleep 30
          done

  # Gate 2: fmt + clippy + tests of the host workspace on the exact tagged tree (the CLI and the
  # crates it links: tower-protocol, tower-flasher).
  checks:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Install Rust (rust-toolchain.toml pin)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: thumbv6m-none-eabi
          components: rustfmt, clippy, llvm-tools
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # Build + package each target with a read-only token; archives travel to `publish` as
  # workflow artifacts (nothing here can write to the release).
  build:
    name: Build ${{ matrix.target }}
    needs: [verify, checks]
    # A dry run skips `verify`; a skipped need would otherwise skip this job too.
    if: >-
      ${{ !cancelled() && needs.checks.result == 'success' &&
          (needs.verify.result == 'success' ||
           (needs.verify.result == 'skipped' && github.ref_type != 'tag')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every Linux target builds in a cross image (an old glibc), so the binary runs on any
          # current distribution: a native build on ubuntu-latest needs that runner's glibc.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml's components + targets are installed too, so rustup never has to
      # auto-install anything when cargo reads it.
      - name: Install Rust (rust-toolchain.toml pin + target)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}, thumbv6m-none-eabi
          components: rustfmt, clippy, llvm-tools

      # The Linux builds get libudev and the vendored OpenSSL's perl + make inside the cross
      # images (the root Cross.toml). No build cache: a cache saved under a tag is never reused,
      # and a release should not restore one.
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cross@0.2.5

      # crt-static: tower.exe carries the C runtime instead of needing the VC++ redistributable.
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.cross }}
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          if [ "$USE_CROSS" = "true" ]; then
            cross build --locked --release -p tower-cli --target "$TARGET"
          else
            cargo build --locked --release -p tower-cli --target "$TARGET"
          fi

      # The newest glibc symbol the binary needs: what the oldest distribution it runs on must
      # have. Fail above 2.28 (Debian 10, RHEL 8).
      - name: glibc floor (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          floor="$(readelf -W --version-info "target/${TARGET}/release/tower" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "needs ${floor}"
          if [ "$(printf '%s\nGLIBC_2.28\n' "$floor" | sort -V | tail -1)" != "GLIBC_2.28" ]; then
            echo "::error::${TARGET} needs ${floor}, newer than GLIBC_2.28"
            exit 1
          fi

      # Archive name = tag + target, e.g. tower-cli-v1.0.0-aarch64-apple-darwin.tar.gz (a dry run
      # names it after the branch).
      - name: Package
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          staging="tower-${GITHUB_REF_NAME}-${TARGET}"
          mkdir "$staging"
          cp cli/README.md LICENSE "$staging/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${TARGET}/release/tower.exe" "$staging/"
            7z a "$staging.zip" "$staging" >/dev/null
            asset="$staging.zip"
          else
            cp "target/${TARGET}/release/tower" "$staging/"
            tar -czf "$staging.tar.gz" "$staging"
            asset="$staging.tar.gz"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "checksum=$asset.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

  # The product firmware from the same commit, as raw images for `tower flash`: the matched set
  # for this `tower` binary (same schema tags), so a kit user needs no embedded toolchain.
  firmware:
    name: Build firmware images
    needs: [verify, checks]
    if: >-
      ${{ !cancelled() && needs.checks.result == 'success' &&
          (needs.verify.result == 'success' ||
           (needs.verify.result == 'skipped' && github.ref_type != 'tag')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml pin) + thumbv6m
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: thumbv6m-none-eabi
          components: rustfmt, clippy, llvm-tools
      - name: Install flip-link (the firmware linker)
        run: cargo install --locked --version 0.1.12 flip-link
      # Inside firmware/, so its .cargo/config.toml (target + flip-link) applies. The images are
      # what `just fw build app <name>` makes (objcopy -O binary of the release ELF).
      - name: Build + package
        shell: bash
        working-directory: firmware
        run: |
          apps=(radio_push_button radio_dongle_gateway)
          examples=(blinky)
          args=()
          for a in "${apps[@]}"; do args+=(--bin "$a"); done
          for e in "${examples[@]}"; do args+=(--example "$e"); done
          cargo build --locked --release "${args[@]}"
          objcopy="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-objcopy"
          staging="tower-firmware-${GITHUB_REF_NAME}"
          mkdir "../$staging"
          for a in "${apps[@]}"; do "$objcopy" -O binary "target/thumbv6m-none-eabi/release/$a" "../$staging/$a.bin"; done
          for e in "${examples[@]}"; do "$objcopy" -O binary "target/thumbv6m-none-eabi/release/examples/$e" "../$staging/$e.bin"; done
          cp ../LICENSE "../$staging/"
          cat > "../$staging/README.md" <<EOF
          # TOWER firmware ${GITHUB_REF_NAME}

          Raw images for \`tower flash <image>.bin\` (the \`tower\` binary of the same release):

          - \`radio_push_button.bin\`: the push-button node (Core Module)
          - \`radio_dongle_gateway.bin\`: the gateway (Radio Dongle)
          - \`blinky.bin\`: the LED blink example

          See firmware/docs/gateway.md in https://github.com/hardwario/tower for the product.
          EOF
          cd ..
          zip -qr "$staging.zip" "$staging"
          sha256sum "$staging.zip" > "$staging.zip.sha256"
          ls -l "$staging"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-firmware
          path: |
            tower-firmware-*.zip
            tower-firmware-*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  # The only job with write access: attest build provenance for every archive (verifiable with
  # `gh attestation verify <archive> --repo hardwario/tower`), then create the release as a
  # draft, upload, and publish, so users never see a half-populated release, and assets are
  # attached before publication (required once immutable releases are enabled).
  publish:
    name: Attest + publish release
    needs: [build, firmware]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets
      id-token: write # OIDC token for the Sigstore signing certificate
      attestations: write # persist the provenance attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify checksums
        working-directory: dist
        run: |
          ls -l
          for f in *.sha256; do sha256sum -c "$f"; done

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Create draft release + upload assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            ## tower CLI ${{ github.ref_name }}

            Host CLI/TUI for the HARDWARIO TOWER console link (`cli/` in this repository). The
            `tower` binary decodes the framed serial protocol of the TOWER firmware (logs,
            events, shell), which a plain serial monitor shows only as raw frame bytes; it also
            flashes, erases, resets and identifies boards over the STM32 UART bootloader, and
            bridges the radio network to MQTT (`tower gateway`).

            ### Install
            Download the archive for your platform, extract it, and put `tower` on your `PATH`:
            ```sh
            tar -xzf tower-${{ github.ref_name }}-<target>.tar.gz   # .zip on Windows
            sudo mv tower-cli-*/tower /usr/local/bin/              # macOS / Linux
            ```
            Each archive ships with a matching `.sha256`, and every archive carries a signed
            build-provenance attestation:
            ```sh
            gh attestation verify tower-${{ github.ref_name }}-<target>.tar.gz --repo hardwario/tower
            ```

            ### Assets
            | Platform | Target |
            |----------|--------|
            | Linux x86_64 | `x86_64-unknown-linux-gnu` |
            | Linux ARM64 | `aarch64-unknown-linux-gnu` |
            | Linux ARMv7 (Raspberry Pi) | `armv7-unknown-linux-gnueabihf` |
            | macOS Intel | `x86_64-apple-darwin` |
            | macOS Apple Silicon | `aarch64-apple-darwin` |
            | Windows x86_64 | `x86_64-pc-windows-msvc` |

            ### Firmware
            `tower-firmware-${{ github.ref_name }}.zip` holds the product firmware built from the
            same commit (`radio_push_button.bin`, `radio_dongle_gateway.bin`, `blinky.bin`). This
            `tower` talks only to firmware of the same sources: flash these images (`tower flash
            radio_push_button.bin`) or build from the tag.

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
