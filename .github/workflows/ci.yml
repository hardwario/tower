# CI for the HARDWARIO TOWER monorepo.
#
# Two Cargo workspaces: the HOST workspace at the root (crates/*, cli, hil) and the FIRMWARE
# workspace in firmware/ (thumbv6m-none-eabi + the flip-link linker, via firmware/.cargo/
# config.toml, which only applies when cargo runs inside firmware/). The firmware, the `tower`
# CLI and the HIL harness all build crates/protocol by path, so the wire-format lockstep is a
# compile-time fact; what is left to guard is the wire itself (the `wire-guard` job). There is no
# hardware in CI: the HIL bench tests are #[ignore]d and only compiled.
#
# `just check` runs the same gates locally.
#
# Supply chain: every action is pinned to a full commit SHA (the comment names the release;
# Dependabot keeps them current), the workflow token is read-only, checkouts don't persist it,
# every cargo invocation is `--locked` to the committed Cargo.lock, and RustSec advisories are
# checked (`audit`).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # MUST equal `channel` in rust-toolchain.toml (the `audit` job enforces it), so CI builds with
  # exactly the toolchain a local checkout uses. Bump both together (release-cli.yml too).
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  # 1. The host workspace: the shared crates, the `tower` CLI and the HIL harness.
  host:
    name: host workspace (fmt, clippy, test, rustdoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # serialport (tower-boot, cli, hil) links against libudev on Linux.
      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Install Rust (rust-toolchain.toml pin) + thumbv6m
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: thumbv6m-none-eabi
          components: rustfmt, clippy, llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The PPK2 power group is feature-gated (`power`), so the plain workspace pass skips it.
      - name: clippy (tower-hil --features power)
        run: cargo clippy -p tower-hil --all-targets --features power --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      # The bench tests are #[ignore]d: this proves every HIL group (incl. power) compiles.
      - name: HIL harness compiles (incl. power, no hardware)
        run: cargo test -p tower-hil --features power --no-run --locked
      # The shared crates must stay no_std on their own (the firmware job builds them only with
      # the SDK's feature set).
      - name: no_std build of the shared crates (thumbv6m)
        run: >-
          cargo build --locked --target thumbv6m-none-eabi -p tower-protocol -p tower-kv
          -p tower-net -p tower-radio -p tower-gateway -p tower-shell
      # The libraries' public docs (and their links to each other) must resolve.
      - name: rustdoc (libraries, -D warnings)
        run: cargo doc --locked --no-deps --workspace --exclude tower-cli --exclude tower-hil
        env:
          RUSTDOCFLAGS: -D warnings

  # 1b. The CLI ships for macOS and Windows too: run its (and its libraries') behavioural tests
  #     there (TTY/SIGPIPE handling, serial enumeration and timeouts are platform-sensitive).
  host-os:
    name: tower CLI build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml pin)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: thumbv6m-none-eabi
          components: rustfmt, clippy, llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build (release)
        run: cargo build --locked --release -p tower-cli
      - name: Test
        run: cargo test --locked -p tower-cli -p tower-boot -p tower-protocol

  # 2. The firmware workspace (thumbv6m). Runs inside firmware/ so its .cargo/config.toml (target
  #    + flip-link) applies; `just fw ci` is the same set locally.
  firmware:
    name: firmware (build, RAM budget, clippy, rustdoc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml pin) + thumbv6m
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: thumbv6m-none-eabi
          components: rustfmt, clippy, llvm-tools
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: firmware -> target
      # firmware/.cargo/config.toml sets `linker = "flip-link"` (stack-overflow protection), so
      # every embedded link needs the binary on PATH. Exact version + its own lockfile.
      - name: Install flip-link (the firmware linker)
        run: cargo install --locked --version 0.1.12 flip-link
      # The one root rustfmt.toml (110 cols) covers this workspace too.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: Build lib + product bins + examples (thumbv6m)
        run: cargo build --locked --release --lib --bins --examples
      # flip-link puts the stack below the statics on the 20 KB part; guard that every product
      # bin still leaves enough stack (see tools/check_ram_budget.py + docs/gateway.md).
      - name: RAM budget guard
        run: python3 tools/check_ram_budget.py radio_push_button radio_dongle_gateway radio_climate_monitor
      # clippy can't run --all-targets on thumbv6m (tests need host libtest), so the buildable
      # targets are linted. The ~20 two-board examples gate their sender/node/peer halves behind
      # role features: lint AND build each role, so a warning or an API break inside a
      # #[cfg(feature = "role-...")] branch can't merge green.
      - name: clippy (lib, examples, bins)
        run: cargo clippy --locked --lib --examples --bins -- -D warnings
      - name: clippy + build (role-gated example variants)
        run: |
          for f in role-gateway role-node role-node,node-2 role-peer-a role-peer-b; do
            echo "::group::--features $f"
            cargo clippy --locked --examples --features "$f" -- -D warnings
            cargo build --locked --release --examples --features "$f"
            echo "::endgroup::"
          done
      # --document-private-items: the module docs deliberately narrate the internals with
      # intra-doc links; building the private items keeps those links live, and the -A silences
      # the corresponding lint (broken links, bare URLs, malformed HTML still fail).
      - name: rustdoc (-D warnings, incl. private items)
        run: cargo doc --locked --no-deps --lib --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::private-intra-doc-links
      # `just examples` / `just apps` are hand-maintained (OS-independent recipes, no ls/sed);
      # fail when they drift from the files on disk.
      - name: just examples / apps match examples/*.rs / apps/*.rs
        run: just lists

  # 3. The wire itself: golden vectors that changed since the latest `protocol-v*` tag need a
  #    PROTOCOL_VERSION / RADIO_SCHEMA_VERSION bump (postcard is not self-describing).
  wire-guard:
    name: wire-bump guard (goldens vs version constants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags: the guard diffs against the latest protocol-v* tag
          persist-credentials: false
      - name: Golden vectors changed => version bumped
        run: python3 crates/protocol/tools/check_wire_bump.py
      # The guard guards the wire; this guards the guard (synthetic repos, expected verdicts).
      - name: Wire-bump guard self-test
        run: python3 crates/protocol/tools/check_wire_bump.py --self-test

  # 4. RustSec advisories for both lockfiles. Vulnerabilities fail the job; informational
  #    warnings (unmaintained / unsound / yanked) are printed but do not, notably `bare-metal`
  #    (unmaintained, RUSTSEC-2026-0110), pulled in by cortex-m 0.7 with no maintained
  #    replacement upstream yet.
  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI toolchain == rust-toolchain.toml
        run: |
          want="$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' rust-toolchain.toml)"
          if [ "$want" != "$RUST_TOOLCHAIN" ]; then
            echo "::error::rust-toolchain.toml pins '$want' but the workflows use RUST_TOOLCHAIN='$RUST_TOOLCHAIN'; bump both together"
            exit 1
          fi
          for wf in .github/workflows/*.yml; do
            if ! grep -q "RUST_TOOLCHAIN: \"$want\"" "$wf"; then
              echo "::error::$wf does not set RUST_TOOLCHAIN \"$want\"; bump every workflow together"
              exit 1
            fi
          done
      - name: Install cargo-audit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2
      # `cargo-audit audit`, not `cargo audit`: it only reads the lockfile, so no toolchain is
      # needed (the `cargo` proxy would otherwise resolve rust-toolchain.toml).
      - name: cargo audit (host workspace)
        run: cargo-audit audit
      - name: cargo audit (firmware)
        run: cargo-audit audit --file firmware/Cargo.lock
